name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no mandatory dependencies)
        run: pip install -r requirements.txt
      - name: Unit tests (pure-Python backend)
        run: python -m unittest discover -s tests -v
      - name: Install eval7 and re-run (accelerated backend + agreement tests)
        run: |
          pip install eval7
          python -m unittest discover -s tests -v
      - name: Simulation smoke (25 tables, deterministic)
        run: python -m sim.run --tables 25 --seed 7

# Timing benchmarks run locally only (python -m benchmarks.strength/policy):
# wall-clock percentiles are hardware claims, and shared CI runners cannot
# promise them.
